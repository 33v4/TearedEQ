name: Build TearedEQ (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show repo files (for debugging)
        shell: pwsh
        run: |
          Write-Host "---- Top level ----"
          Get-ChildItem -Force | Select-Object Name
          Write-Host "---- Source folder ----"
          Get-ChildItem Source | Select-Object Name

      - name: Configure (CMake, Visual Studio 17 2022, JUCE via FetchContent)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3
        run: cmake --build build --config Release --target TearedEQ_VST3 --parallel

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse build/TearedEQ_artefacts/Release/VST3 | Select-Object FullName

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TearedEQ-VST3-Windows
          path: build/TearedEQ_artefacts/Release/VST3
          if-no-files-found: error
